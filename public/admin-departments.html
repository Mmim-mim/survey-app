<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>จัดการฝ่าย — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
      :root {
        --red: #8b1515;
        --gold: #c9a34e;
        --card: #ffffff;
        --line: #ead8c8;
        --text: #241414;
        --muted: #7b6b6b;
        --shadow: 0 12px 30px rgba(139, 21, 21, 0.1);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans Thai", system-ui, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(139, 21, 21, 0.12),
            transparent 32%
          ),
          radial-gradient(
            circle at top right,
            rgba(201, 163, 78, 0.22),
            transparent 34%
          ),
          linear-gradient(135deg, #fffaf5 0%, #fff1e5 100%);
        color: var(--text);
      }




















      .page {
        padding: 28px 42px 42px;
        max-width: 1300px;
        margin: 0 auto;
        width: 100%;
        transition:
          margin-left 0.28s ease,
          width 0.28s ease;
      }



      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        color: var(--red);
        font-size: 34px;
        font-weight: 900;
      }

      .sub {
        color: var(--muted);
        margin-top: 6px;
        font-weight: 600;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel h2 {
        margin: 0;
        color: var(--red);
        font-size: 20px;
        font-weight: 900;
      }

      .form-row {
        display: grid;
        grid-template-columns: 2fr 1.2fr 1.2fr 160px 140px 180px;
        gap: 10px;
        align-items: center;
        margin-bottom: 20px;
      }
      input,
      select {
        height: 44px;
        border: 1px solid #e2c8b5;
        border-radius: 14px;
        padding: 0 12px;
        background: white;
        font: inherit;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px rgba(201, 163, 78, 0.22);
      }

      .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--red);
        border-radius: 14px;
        padding: 10px 14px;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        font-family: inherit;
      }

      .btn.primary {
        background: linear-gradient(90deg, var(--red), var(--gold));
        color: white;
        border-color: transparent;
      }

      .btn.danger {
        color: #b91c1c;
        border-color: #fecaca;
        background: #fff5f5;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid #f0dfd0;
        border-radius: 16px;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #f0dfd0;
        text-align: left;
        font-size: 14px;
      }

      th {
        background: #fff1e6;
        color: var(--red);
        font-weight: 900;
      }

      td {
        background: #fffdf9;
      }

      .badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 900;
      }

      /* admin */
      .badge.admin {
        background: #fff1e6;
        color: #8b1515;
      }

      /* manager */
      .badge.manager {
        background: #e0f2fe;
        color: #0369a1;
      }

      /* staff */
      .badge.staff {
        background: #dcfce7;
        color: #15803d;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .user-groups {
        display: grid;
        gap: 14px;
      }

      .user-group {
        overflow: hidden;
        border: 1px solid #f0dfd0;
        border-radius: 16px;
        background: #fffdf9;
      }

      .group-title {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff1e6;
        color: var(--red);
        font-weight: 900;
      }

      .group-count {
        padding: 4px 10px;
        border-radius: 999px;
        background: #f8dfd8;
        color: var(--red);
        font-size: 12px;
        font-weight: 900;
      }

      .user-group table {
        min-width: 760px;
      }

      @media (max-width: 900px) {
        .page {
          padding: 84px 18px 28px;
        }

        .form-row {
          grid-template-columns: 1fr;
        }
      }

      .user-table {
        width: 100%;
        table-layout: fixed;
      }

      .user-table th:nth-child(1),
      .user-table td:nth-child(1) {
        width: 14%;
      }

      .user-table th:nth-child(2),
      .user-table td:nth-child(2) {
        width: 22%;
      }

      .user-table th:nth-child(3),
      .user-table td:nth-child(3) {
        width: 28%;
      }

      .user-table th:nth-child(4),
      .user-table td:nth-child(4) {
        width: 12%;
      }

      .user-table th:nth-child(5),
      .user-table td:nth-child(5) {
        width: 14%;
      }

      .user-table th:nth-child(6),
      .user-table td:nth-child(6) {
        width: 10%;
      }
      .header-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
      @media(max-width:600px) { .header { flex-wrap:wrap; } }

.page { padding-top:84px; }
.header-actions { flex-shrink:0; }
.prototype-note { padding:12px 16px; border:1px solid #e7d39f; background:#fff8e6; border-radius:12px; margin:0 0 20px; color:#705222; font-size:14px; }
.department-table { min-width:560px; }
.department-table td:nth-child(2) { overflow-wrap:anywhere; }
.department-table th:first-child { width:70px; }
.department-table th:nth-child(3) { width:130px; }
.department-table th:last-child { width:100px; }
.badge.on { background:#e5f3e9; color:#22613c; }
.badge.off { background:#eee8e4; color:#6d6059; }
.department-table tr:last-child td { border-bottom:0; }
dialog { width:min(520px,calc(100% - 32px)); max-height:calc(100dvh - 32px); overflow:auto; padding:24px; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); color:var(--text); }
dialog::backdrop { background:rgba(36,20,20,.45); }
dialog h2 { color:var(--red); margin:0; }
.dialog-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
.dialog-heading .btn { flex-shrink:0; padding:7px 10px; font-size:13px; }
.field-label { display:block; margin-bottom:8px; font-weight:600; }
#departmentName { width:100%; }
fieldset { border:0; padding:0; margin:20px 0; }
legend { font-weight:600; margin-bottom:8px; }
.radio-row { display:flex; gap:20px; flex-wrap:wrap; }
.radio-row label { display:flex; align-items:center; gap:8px; }
.radio-row input { width:18px; height:18px; margin:0; accent-color:var(--red); }
.dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
.btn:focus-visible, a:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
#notice { color:#22613c; min-height:24px; margin:12px 0 0; }
@media(max-width:600px) { h1 { font-size:27px; } .header { flex-direction:column; } .header-actions { width:100%; } .header-actions .btn { flex:1; text-align:center; } .panel { padding:12px; }   }
</style><link rel="stylesheet" href="admin-navigation.css">
</head><body>
<button class="hamburger" id="hamburgerBtn" type="button" aria-label="เปิดเมนู Admin" aria-controls="sidebar" aria-expanded="false">☰</button><div class="sidebar-overlay" id="sidebarOverlay"></div>

<main class="page"><div class="header admin-page-header"><div class="admin-heading"><a class="admin-back" href="admin.html" aria-label="ย้อนกลับ" title="ย้อนกลับ">←</a><div class="admin-heading-text"><h1>🏢 จัดการฝ่าย</h1><div class="sub">เพิ่ม แก้ไข และกำหนดสถานะฝ่ายภายในศูนย์บรรณสารและสื่อการศึกษา</div></div></div><div class="header-actions"><button class="btn primary" id="addDepartment" type="button">+ เพิ่มฝ่าย</button></div></div>

<section class="panel" aria-labelledby="listHeading"><div class="panel-head"><h2 id="listHeading">รายการฝ่าย</h2><span class="group-count" id="departmentCount"></span></div><div class="table-wrap" tabindex="0" aria-label="ตารางฝ่าย เลื่อนแนวนอนได้"><table class="department-table"><thead><tr><th scope="col">ลำดับ</th><th scope="col">ชื่อฝ่าย</th><th scope="col">สถานะ</th><th scope="col">จัดการ</th></tr></thead><tbody id="departmentRows"></tbody></table></div><p id="notice" role="status" aria-live="polite"></p></section></main>
<dialog id="departmentDialog" aria-labelledby="dialogTitle"><form id="departmentForm"><div class="dialog-heading"><h2 id="dialogTitle">เพิ่มฝ่าย</h2><button class="btn danger" id="deleteDepartment" type="button" hidden>ลบฝ่าย</button></div><label class="field-label" for="departmentName">ชื่อฝ่าย</label><input id="departmentName" name="name" required maxlength="255" autocomplete="off" placeholder="กรอกชื่อฝ่าย"><fieldset><legend>สถานะ</legend><div class="radio-row"><label><input type="radio" name="status" value="active" checked>ใช้งาน</label><label><input type="radio" name="status" value="inactive">ปิดใช้งาน</label></div></fieldset><div class="dialog-actions"><button class="btn" type="button" id="cancelDepartment">ยกเลิก</button><button class="btn primary" type="submit">บันทึก</button></div></form></dialog>
