<!doctype html>
<html lang="th">
  <head>
    <link rel="stylesheet" href="admin-popup.css">
    <script src="admin-popup.js"></script>
    <script src="auth-client.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>จัดการผู้ใช้</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --red: #8b1515;
        --gold: #c9a34e;
        --card: #ffffff;
        --line: #ead8c8;
        --text: #241414;
        --muted: #7b6b6b;
        --shadow: 0 12px 30px rgba(139, 21, 21, 0.1);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans Thai", system-ui, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(139, 21, 21, 0.12),
            transparent 32%
          ),
          radial-gradient(
            circle at top right,
            rgba(201, 163, 78, 0.22),
            transparent 34%
          ),
          linear-gradient(135deg, #fffaf5 0%, #fff1e5 100%);
        color: var(--text);
      }




















      .page {
        padding: 28px 42px 42px;
        max-width: 1300px;
        margin: 0 auto;
        width: 100%;
        transition:
          margin-left 0.28s ease,
          width 0.28s ease;
      }



      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        color: var(--red);
        font-size: 34px;
        font-weight: 900;
      }

      .sub {
        color: var(--muted);
        margin-top: 6px;
        font-weight: 600;
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .panel h2 {
        margin: 0;
        color: var(--red);
        font-size: 20px;
        font-weight: 900;
      }

      .form-row {
        display: grid;
        grid-template-columns: 2fr 1.2fr 1.2fr 160px 140px 180px;
        gap: 10px;
        align-items: center;
        margin-bottom: 20px;
      }
      input,
      select {
        height: 44px;
        border: 1px solid #e2c8b5;
        border-radius: 14px;
        padding: 0 12px;
        background: white;
        font: inherit;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px rgba(201, 163, 78, 0.22);
      }

      .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--red);
        border-radius: 14px;
        padding: 10px 14px;
        font-weight: 900;
        cursor: pointer;
        text-decoration: none;
        font-family: inherit;
      }

      .btn.primary {
        background: linear-gradient(90deg, var(--red), var(--gold));
        color: white;
        border-color: transparent;
      }

      .btn.danger {
        color: #b91c1c;
        border-color: #fecaca;
        background: #fff5f5;
      }

      .table-wrap {
        overflow: auto;
        border: 1px solid #f0dfd0;
        border-radius: 16px;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #f0dfd0;
        text-align: left;
        font-size: 14px;
      }

      th {
        background: #fff1e6;
        color: var(--red);
        font-weight: 900;
      }

      td {
        background: #fffdf9;
      }

      .badge {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 900;
      }

      /* admin */
      .badge.admin {
        background: #fff1e6;
        color: #8b1515;
      }

      /* manager */
      .badge.manager {
        background: #e0f2fe;
        color: #0369a1;
      }

      /* staff */
      .badge.staff {
        background: #dcfce7;
        color: #15803d;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }

      .user-groups {
        display: grid;
        gap: 14px;
      }

      .user-group {
        overflow: hidden;
        border: 1px solid #f0dfd0;
        border-radius: 16px;
        background: #fffdf9;
      }

      .group-title {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: #fff1e6;
        color: var(--red);
        font-weight: 900;
      }

      .group-count {
        padding: 4px 10px;
        border-radius: 999px;
        background: #f8dfd8;
        color: var(--red);
        font-size: 12px;
        font-weight: 900;
      }

      .user-group table {
        min-width: 760px;
      }

      @media (max-width: 900px) {
        .page {
          padding: 84px 18px 28px;
        }

        .form-row {
          grid-template-columns: 1fr;
        }
      }

      .user-table {
        width: 100%;
        table-layout: fixed;
      }

      .user-table th:nth-child(1),
      .user-table td:nth-child(1) {
        width: 14%;
      }

      .user-table th:nth-child(2),
      .user-table td:nth-child(2) {
        width: 22%;
      }

      .user-table th:nth-child(3),
      .user-table td:nth-child(3) {
        width: 28%;
      }

      .user-table th:nth-child(4),
      .user-table td:nth-child(4) {
        width: 12%;
      }

      .user-table th:nth-child(5),
      .user-table td:nth-child(5) {
        width: 14%;
      }

      .user-table th:nth-child(6),
      .user-table td:nth-child(6) {
        width: 10%;
      }
      .header-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
      @media(max-width:600px) { .header { flex-wrap:wrap; } }
    </style>

    <main class="page">
      <div class="header admin-page-header">
        <div class="admin-heading"><a class="admin-back" href="admin.html" aria-label="ย้อนกลับ" title="ย้อนกลับ">←</a><div class="admin-heading-text">
          <h1>👥 จัดการผู้ใช้</h1>
          <div class="sub">เพิ่มผู้ใช้ ลบผู้ใช้ และเปลี่ยน Role ของผู้ใช้</div>
        </div></div>

        <div class="header-actions">

          <a class="btn" href="/admin-departments.html">จัดการฝ่าย</a>
          <button class="btn primary" id="btnRefresh">รีเฟรชข้อมูล</button>
        </div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>เพิ่มผู้ใช้ใหม่</h2>
        </div>

        <div class="form-row">
          <input id="newDisplayName" placeholder="ชื่อที่ต้องการให้แสดง" />
          <input id="newUsername" placeholder="username" />
          <input id="newPassword" placeholder="password" type="password" />

          <select id="newDeptName">
            <option value="">-- เลือกฝ่าย --</option>
          </select>

          <select id="newRole">
            <option value="staff">staff</option>
            <option value="manager">manager</option>
            <option value="admin">admin</option>
          </select>

          <button class="btn primary" id="btnAddUser">เพิ่มผู้ใช้</button>
        </div>

        <div id="userGroups">
          <div class="empty">กำลังโหลด...</div>
        </div>
      </section>
